<!DOCTYPE html>
<html>
<head>
  <style>
  body {
    background-color: #0D2137;
    color: #A8DADE;
    text-align: center;
    font-family: sans-serif;
  }
</style>
<meta charset="UTF-8">
<title>底なき海</title>
</head>
<body>

<h1>底なき海</h1>

<p>底なし街で観測された記録を保管する場所。</p>

 <div style="display:inline-flex; border:1px solid rgba(168,218,222,0.3); border-radius:8px; overflow:hidden; margin:2rem 0;">
    <button id="tab-music" onclick="show('music')" style="background:rgba(168,218,222,0.15); color:#A8DADE; border:none; padding:10px 28px; font-size:14px; cursor:pointer; font-family:sans-serif;">楽曲</button>
    <button id="tab-log" onclick="show('log')" style="background:transparent; color:#A8DADE; border:none; border-left:1px solid rgba(168,218,222,0.3); padding:10px 28px; font-size:14px; cursor:pointer; font-family:sans-serif; opacity:0.5;">観測記録</button>
  </div>

  <div id="pane-music">
    <p>E-BlackHole</p> 
    <p>底なし街</p>
    <p>Fog of Foam</p>
    <p>Xabónと泡</p>
    <p>光るパールを拾う</p>
  </div>

  <div id="pane-log" style="display:none;">
    <p>観測記録はまだありません。</p>
  </div>

  <script>
    function show(tab) {
      document.getElementById('pane-music').style.display = tab === 'music' ? 'block' : 'none';
      document.getElementById('pane-log').style.display = tab === 'log' ? 'block' : 'none';
      document.getElementById('tab-music').style.background = tab === 'music' ? 'rgba(168,218,222,0.15)' : 'transparent';
      document.getElementById('tab-music').style.opacity = tab === 'music' ? '1' : '0.5';
      document.getElementById('tab-log').style.background = tab === 'log' ? 'rgba(168,218,222,0.15)' : 'transparent';
      document.getElementById('tab-log').style.opacity = tab === 'log' ? '1' : '0.5';
    }
  </script>
  
</body>
</html>
