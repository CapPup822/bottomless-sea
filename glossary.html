<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>用語集 — 底なき海</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0D2137;
      color: #A8DADE;
      text-align: center;
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
      padding: 4rem 2rem;
      margin: 0;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: 2.4rem;
      letter-spacing: 0.08em;
      margin-bottom: 2rem;
      color: #C8EAED;
      text-shadow: 0 0 40px rgba(168,218,222,0.35);
    }
    .back {
      display: inline-block;
      color: #A8DADE;
      text-decoration: none;
      opacity: 0.35;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      margin-bottom: 2.5rem;
      transition: opacity 0.3s;
    }
    .back:hover { opacity: 0.7; }
    .entries { max-width: 560px; margin: 1rem auto 0; text-align: left; }
    .entry {
      padding: 2.2rem 0;
      border-bottom: 1px solid transparent;
      border-image: linear-gradient(to right, transparent, rgba(168,218,222,0.2), transparent) 1;
    }
    .entry-term {
      font-size: 1rem;
      letter-spacing: 0.06em;
      margin-bottom: 0.8rem;
      color: #C8EAED;
    }
    .entry-body {
      font-size: 0.82rem;
      line-height: 2.2;
      opacity: 0.6;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back">← 底なき海</a>
  <h1>用語集</h1>

  <div class="entries">

    <div class="entry">
      <div class="entry-term">底なし街</div>
      <div class="entry-body">光あふれる街並みが壁面から出っ張るように見える海溝。この海溝に底はない。</div>
    </div>

     <div class="entry">
      <div class="entry-term">ハイパーロード</div>
      <div class="entry-body">底なし街同士をつなぐ道。人々は恐ろしい速さでここを移動している。</div>
    </div>

    <div class="entry">
      <div class="entry-term">泡</div>
      <div class="entry-body">底なし街にあふれる、訪れた人にとっての憩いの場。しかし音もなく弾けてしまう可能性が高い。</div>
    </div>

  </div>
</body>
</html>
