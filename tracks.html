<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>楽曲一覧 — 底なき海</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0D2137;
      color: #A8DADE;
      text-align: center;
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
      padding: 4rem 2rem;
      margin: 0;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: 2.4rem;
      letter-spacing: 0.08em;
      margin-bottom: 2rem;
      color: #C8EAED;
      text-shadow: 0 0 40px rgba(168,218,222,0.35);
    }
    .back {
      display: inline-block;
      color: #A8DADE;
      text-decoration: none;
      opacity: 0.35;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      margin-bottom: 2.5rem;
      transition: opacity 0.3s;
    }
    .back:hover { opacity: 0.7; }
    .list { max-width: 520px; margin: 0 auto; }
    .track {
      border-bottom: 1px solid transparent;
      border-image: linear-gradient(to right, transparent, rgba(168,218,222,0.2), transparent) 1;
      cursor: pointer;
      text-align: left;
    }
    .track-title {
      padding: 16px 4px;
      font-size: 1rem;
      letter-spacing: 0.05em;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: color 0.3s, text-shadow 0.3s;
    }
    .track:hover .track-title {
      color: #D8F0F2;
      text-shadow: 0 0 16px rgba(168,218,222,0.4);
    }
    .track-title::after {
      content: '+';
      opacity: 0.3;
      font-size: 1.2rem;
      font-family: 'Cormorant Garamond', serif;
      transition: opacity 0.3s;
    }
    .track.open .track-title::after { content: '−'; opacity: 0.6; }
    .track-body {
      display: none;
      opacity: 0.6;
      font-size: 0.82rem;
      line-height: 2.1;
      padding: 0 4px 16px;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back">← 底なき海</a>
  <h1>楽曲一覧</h1>

  <div class="list">
    <div class="track" onclick="toggle('t1')">
      <div class="track-title">E-BlackHole</div>
      <div id="t1" class="track-body">強い重力を伴った、底なし街への入り口。発生場所に規則性はない。</div>
    </div>
    <div class="track" onclick="toggle('t2')">
      <div class="track-title">底なし街</div>
      <div id="t2" class="track-body">最も煌びやかで、最も深い闇を携えた、海中の街。</div>
    </div>
    <div class="track" onclick="toggle('t3')">
      <div class="track-title">Fog of Foam</div>
      <div id="t3" class="track-body">ここに解説を書く</div>
    </div>
    <div class="track" onclick="toggle('t4')">
      <div class="track-title">Xabónと泡</div>
      <div id="t4" class="track-body">ここに解説を書く</div>
    </div>
    <div class="track" onclick="toggle('t5')">
      <div class="track-title">光るパールを拾う</div>
      <div id="t5" class="track-body">ここに解説を書く</div>
    </div>
    <div class="track" onclick="toggle('t6')">
      <div class="track-title">浜辺</div>
      <div id="t6" class="track-body">ここに解説を書く</div>
    </div>
    <div class="track" onclick="toggle('t7')">
      <div class="track-title">Virus tr</div>
      <div id="t7" class="track-body">ここに解説を書く</div>
    </div>
    <div class="track" onclick="toggle('t8')">
      <div class="track-title">DIMENTIA</div>
      <div id="t8" class="track-body">ここに解説を書く</div>
    </div>
    <div class="track" onclick="toggle('t9')">
      <div class="track-title">ANESTHANASIA</div>
      <div id="t9" class="track-body">荒れ狂う水流に耐性をつけるべく、麻酔を受けた人々の末路。</div>
    </div>
  </div>

  <script>
    function toggle(id) {
      const body = document.getElementById(id);
      const track = body.closest('.track');
      const isOpen = track.classList.contains('open');
      document.querySelectorAll('.track').forEach(t => {
        t.classList.remove('open');
        t.querySelector('.track-body').style.display = 'none';
      });
      if (!isOpen) {
        track.classList.add('open');
        body.style.display = 'block';
      }
    }
  </script>
</body>
</html>
