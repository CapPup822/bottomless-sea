<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>楽曲一覧 — 底なき海</title>
  <style>
    body {
      background-color: #0D2137;
      color: #A8DADE;
      text-align: center;
      font-family: sans-serif;
      padding: 4rem 2rem;
    }
    h1 { font-weight: normal; font-size: 2rem; margin-bottom: 0.5rem; }
    .back { display: inline-block; color: #A8DADE; text-decoration: none; opacity: 0.4; font-size: 13px; margin-bottom: 3rem; }
    .back:hover { opacity: 0.8; }
    .list { max-width: 480px; margin: 0 auto; }
    .track {
      border-bottom: 1px solid rgba(168,218,222,0.15);
      cursor: pointer;
      text-align: left;
    }
    .track-title {
      padding: 14px 4px;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .track-title::after { content: '+'; opacity: 0.4; font-size: 18px; }
    .track.open .track-title::after { content: '−'; opacity: 0.7; }
    .track-body {
      display: none;
      opacity: 0.6;
      font-size: 13px;
      line-height: 1.9;
      padding: 0 4px 14px;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back">← 底なき海</a>
  <h1>楽曲一覧</h1>

  <div class="list">
    <div class="track" onclick="toggle('t1')">
      <div class="track-title">E-BlackHole</div>
      <div id="t1" class="track-body">強い重力を伴った、底なし街への入り口。発生場所に規則性はない。</div>
    </div>
    <div class="track" onclick="toggle('t2')">
      <div class="track-title">底なし街</div>
      <div id="t2" class="track-body">最も煌びやかで、最も深い闇を携えた、海中の街</div>
    </div>
    <div class="track" onclick="toggle('t3')">
      <div class="track-title">ANESTHANASIA</div>
      <div id="t3" class="track-body">荒れ狂う水流に耐性をつけるべく、麻酔を受けた人々の末路。</div>
    </div>
  </div>

  <script>
    function toggle(id) {
      const body = document.getElementById(id);
      const track = body.closest('.track');
      const isOpen = track.classList.contains('open');
      document.querySelectorAll('.track').forEach(t => {
        t.classList.remove('open');
        t.querySelector('.track-body').style.display = 'none';
      });
      if (!isOpen) {
        track.classList.add('open');
        body.style.display = 'block';
      }
    }
  </script>
</body>
</html>
