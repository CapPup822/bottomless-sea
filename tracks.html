<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>楽曲一覧 — 底なき海</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0D2137;
      color: #A8DADE;
      text-align: center;
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
      padding: 4rem 2rem;
      margin: 0;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: 2.4rem;
      letter-spacing: 0.08em;
      margin-bottom: 2rem;
      color: #C8EAED;
      text-shadow: 0 0 40px rgba(168,218,222,0.35);
    }
    .back {
      display: inline-block;
      color: #A8DADE;
      text-decoration: none;
      opacity: 0.35;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      margin-bottom: 2.5rem;
      transition: opacity 0.3s;
    }
    .back:hover { opacity: 0.7; }
    .list { max-width: 520px; margin: 0 auto; }
    .track {
      border-bottom: 1px solid transparent;
      border-image: linear-gradient(to right, transparent, rgba(168,218,222,0.2), transparent) 1;
      text-align: left;
    }
    .track-header {
      padding: 16px 4px;
      font-size: 1rem;
      letter-spacing: 0.05em;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: color 0.3s, text-shadow 0.3s;
    }
    .track-header .title-link {
      color: #A8DADE;
      text-decoration: none;
      transition: color 0.3s, text-shadow 0.3s;
    }
    .track-header .title-link:hover {
      color: #D8F0F2;
      text-shadow: 0 0 16px rgba(168,218,222,0.4);
    }
    .track-header .title-text {
      color: #A8DADE;
    }
    .track:hover .track-header .title-text {
      color: #D8F0F2;
      text-shadow: 0 0 16px rgba(168,218,222,0.4);
    }
    .toggle-btn {
      background: none;
      border: none;
      color: #A8DADE;
      cursor: pointer;
      font-size: 1.2rem;
      font-family: 'Cormorant Garamond', serif;
      opacity: 0.3;
      padding: 0 4px;
      transition: opacity 0.3s;
      flex-shrink: 0;
    }
    .track.open .toggle-btn { opacity: 0.6; }
    .track-body {
      display: none;
      opacity: 0.6;
      font-size: 0.82rem;
      line-height: 2.1;
      padding: 0 4px 16px;
      letter-spacing: 0.04em;
    }
    .page-link {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: #A8DADE;
      text-decoration: none;
      opacity: 0.35;
      border: 1px solid rgba(168,218,222,0.2);
      padding: 3px 8px;
      border-radius: 2px;
      margin-left: 0.8rem;
      flex-shrink: 0;
      transition: opacity 0.3s, border-color 0.3s;
    }
    .page-link:hover {
      opacity: 0.7;
      border-color: rgba(168,218,222,0.45);
    }
  </style>
</head>
<body>
  <a href="index.html" style="position:fixed; top:1.2rem; left:1.5rem; z-index:100;">
    <img src="176.png" alt="底なき海" style="height:40px;">
  </a>
  <a href="index.html" class="back">← 底なき海</a>
  <h1>楽曲一覧</h1>

  <div class="list">

<div class="track" id="track-t1">
      <div class="track-header">
        <a href="track-count-song.html" class="title-link">E-BlackHole</a>
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <a href="track-e-blackhole.html" class="page-link">詳細 →</a>
        </div>
      </div>
  </div>

    <div class="track" id="track-t2">
      <div class="track-header">
        <a href="track-count-song.html" class="title-link">底なし街</a>
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <a href="track-bottomless-city" class="page-link">詳細 →</a>
        </div>
      </div>
  </div>

    <div class="track" id="track-t3">
      <div class="track-header">
        <a href="track-count-song.html" class="title-link">カウント・ソング</a>
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <a href="track-count-song.html" class="page-link">詳細 →</a>
        </div>
      </div>
    </div>

    <div class="track" id="track-t4">
      <div class="track-header">
        <span class="title-text">Fog of Foam</span>
        <button class="toggle-btn" onclick="toggle('t4')">+</button>
      </div>
      <div id="t4" class="track-body">ここに解説を書く</div>
    </div>

    <div class="track" id="track-t5">
      <div class="track-header">
        <span class="title-text">Xabónと泡</span>
        <button class="toggle-btn" onclick="toggle('t5')">+</button>
      </div>
      <div id="t5" class="track-body">ここに解説を書く</div>
    </div>

    <div class="track" id="track-t6">
      <div class="track-header">
        <span class="title-text">光るパールを拾う</span>
        <button class="toggle-btn" onclick="toggle('t6')">+</button>
      </div>
      <div id="t6" class="track-body">ここに解説を書く</div>
    </div>

    <div class="track" id="track-t7">
      <div class="track-header">
        <span class="title-text">浜辺</span>
        <button class="toggle-btn" onclick="toggle('t7')">+</button>
      </div>
      <div id="t7" class="track-body">ここに解説を書く</div>
    </div>

    <div class="track" id="track-t8">
      <div class="track-header">
        <span class="title-text">Virus tr</span>
        <button class="toggle-btn" onclick="toggle('t8')">+</button>
      </div>
      <div id="t8" class="track-body">ここに解説を書く</div>
    </div>

    <div class="track" id="track-t9">
      <div class="track-header">
        <span class="title-text">DIMENTIA</span>
        <button class="toggle-btn" onclick="toggle('t9')">+</button>
      </div>
      <div id="t9" class="track-body">ここに解説を書く</div>
    </div>

    <div class="track" id="track-t10">
      <div class="track-header">
        <span class="title-text">ANESTHANASIA</span>
        <button class="toggle-btn" onclick="toggle('t10')">+</button>
      </div>
      <div id="t10" class="track-body">荒れ狂う水流に耐性をつけるべく、麻酔を受けた人々の末路。</div>
    </div>

  </div>

  <script>
    function toggle(id) {
      const body = document.getElementById(id);
      const track = body.closest('.track');
      const isOpen = track.classList.contains('open');
      document.querySelectorAll('.track').forEach(t => {
        t.classList.remove('open');
        t.querySelector('.track-body').style.display = 'none';
        t.querySelector('.toggle-btn').textContent = '+';
      });
      if (!isOpen) {
        track.classList.add('open');
        body.style.display = 'block';
        track.querySelector('.toggle-btn').textContent = '−';
      }
    }
  </script>
</body>
</html>
